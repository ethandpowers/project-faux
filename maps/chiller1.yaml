# 700-ton water-cooled centrifugal chiller. Exposes both Modbus TCP and BACnet
# through its onboard protocol gateway, as many chillers do.
#
# Modbus: float block from 0, bools from 30, integers from 40.
# BACnet: 1-99 analog, 101-199 binary, 201-299 integer, 301+ strings.
name: chiller1
modbus_device_id: 3
bacnet_device_id: 2001
fields:
  # Chilled water loop (°F, GPM)
  - name: chw_supply_temp
    type: float
    default: 44.1
    modbus: { start: 0, end: 1 }
    bacnet: 1
  - name: chw_return_temp
    type: float
    default: 54.6
    modbus: { start: 2, end: 3 }
    bacnet: 2
  - name: chw_supply_temp_sp
    type: float
    default: 44.0
    modbus: { start: 4, end: 5 }
    bacnet: 3
  - name: chw_flow
    type: float
    default: 960
    modbus: { start: 6, end: 7 }
    bacnet: 4

  # Condenser water loop (°F)
  - name: cw_entering_temp
    type: float
    default: 78.5
    modbus: { start: 8, end: 9 }
    bacnet: 5
  - name: cw_leaving_temp
    type: float
    default: 88.2
    modbus: { start: 10, end: 11 }
    bacnet: 6

  # Refrigerant circuit (psig)
  - name: evap_refrig_pressure
    type: float
    default: 52.3
    modbus: { start: 12, end: 13 }
    bacnet: 7
  - name: cond_refrig_pressure
    type: float
    default: 128.7
    modbus: { start: 14, end: 15 }
    bacnet: 8

  # Capacity and power
  - name: percent_rla
    type: float
    default: 63.0
    modbus: { start: 16, end: 17 }
    bacnet: 9
  - name: input_power_kw
    type: float
    default: 212.4
    modbus: { start: 18, end: 19 }
    bacnet: 10
  - name: capacity_tons
    type: float
    default: 420.0
    modbus: { start: 20, end: 21 }
    bacnet: 11

  # Status
  - name: running
    type: bool
    default: true
    modbus: 30
    bacnet: 101
  - name: chw_flow_proven
    type: bool
    default: true
    modbus: 31
    bacnet: 102
  - name: cw_flow_proven
    type: bool
    default: true
    modbus: 32
    bacnet: 103
  - name: alarm_active
    type: bool
    default: false
    modbus: 33
    bacnet: 104
  - name: remote_control
    type: bool
    default: true
    modbus: 34
    bacnet: 105

  # Counters and codes
  - name: compressor_starts
    type: uint32
    default: 4123
    modbus: { start: 40, end: 41 }
    bacnet: 201
  - name: compressor_run_hours
    type: uint32
    default: 21877
    modbus: { start: 42, end: 43 }
    bacnet: 202
  - name: operating_state       # 0 = off, 1 = starting, 2 = running, 3 = stopping, 4 = tripped
    type: uint16
    default: 2
    modbus: 44
    bacnet: 203
  - name: active_alarm_code
    type: uint16
    default: 0
    modbus: 45
    bacnet: 204

  - name: model
    type: string
    default: CVX-700
    modbus: { start: 100, end: 107 }
    bacnet: 301
