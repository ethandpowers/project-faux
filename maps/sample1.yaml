    bacnet: 259

  - name: last_login
    type: uint32
    modbus:
      start: 265
      end: 266
    bacnet: 260

  - name: frequency
    type: uint16
    modbus: 267
    bacnet: 261

  - name: frequency_factor
    type: int16
    modbus: 268
    bacnet: 262

  - name: id
    type: int32
    modbus:
      start: 269
      end: 270
